[package]
name = "carl-desktop"
version = "0.2.0"
description = "Carl — offline-capable point of sale"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The device secret goes into the OS credential store, never into SQLite or a config file.
keyring = "3"
thiserror = "2"

# Windows only: the print spooler API. Not a vendor SDK and not a USB library — the shop
# installs the printer's own Windows driver, and the spooler passes raw ESC/POS through.
[target.'cfg(windows)'.dependencies]
# Win32_Graphics_Gdi is not a drawing dependency. windows-rs gates OpenPrinterW on it
# because PRINTER_DEFAULTSW embeds a DEVMODEW, so the spooler cannot be opened without it.
# Win32_Security is deliberately absent: only the level-2 printer struct needed it, and
# enumeration asks for level 1.
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Printing",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
