<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Carl</title>
    <!--
      Painted before anything is downloaded.

      A till is opened on a machine that has been asleep in a shop all night, and WebView2
      takes a moment to start on one. Until this file's stylesheet and bundle arrive there is
      nothing to draw, and an empty window on a dark Windows theme is a black screen — which
      is what a cashier standing at the counter reports, and reasonably so.

      So the colours and the first words live here, inline, in the document that the webview
      already has in its hands. The window itself is given the same colour in tauri.conf.json,
      so there is no frame of anything else from the moment it opens.
    -->
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f1115;
        color: #f2f4f8;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 18px;
        text-align: center;
      }
      #boot .mark {
        font-size: 30px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      #boot .said {
        color: #9aa4b2;
        font-size: 16px;
      }
      #boot .bar {
        width: 190px;
        height: 3px;
        border-radius: 2px;
        background: #2a303b;
        overflow: hidden;
      }
      #boot .bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: #3d7dfa;
        animation: carl-boot 1.1s ease-in-out infinite;
      }
      @keyframes carl-boot {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(350%);
        }
      }
      /* The application replaces this the moment it mounts. */
      #root:not(:empty) + #boot {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">
      <div class="mark">Carl</div>
      <div class="bar"></div>
      <div class="said">Starting the till…</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
